<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__GAME_NAME__</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; color: #fff; font: 16px/1.5 system-ui, sans-serif; }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 12px;
      background: #0a0a0a;
      transition: opacity 0.3s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading h1 { font-weight: 600; }
    #loading p { color: #888; font-size: 13px; }
  </style>
</head>
<body>
  <div id="loading">
    <h1>__GAME_NAME__</h1>
    <p>Loading engine...</p>
  </div>
  <canvas id="game-canvas"></canvas>

  <!-- During dev: `td serve` serves engine files at /engine/.
       After `td build`: they live in ./runtime/. -->
  <script src="runtime/js_bridge.js"></script>
  <script src="runtime/td_api.js"></script>
  <script src="runtime/td-engine.js"></script>
  <script src="runtime/tdscript_runtime.js"></script>
  <script src="runtime/td_client_bootstrap.js"></script>
  <script src="game.js"></script>
</body>
</html>
