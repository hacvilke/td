name: CI — Build (Desktop + WebAssembly)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write   # required for uploading release artifacts

jobs:
  # ---------------------------------------------------------------------------
  # WebAssembly build - runs on Ubuntu with Emscripten.
  # Produces web/td-engine.js + web/td-engine.wasm, uploads as a workflow
  # artifact so users can download and run it in their browser.
  # ---------------------------------------------------------------------------
  wasm:
    name: Build WebAssembly
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Verify emcc
        run: emcc --version

      - name: Build WASM bundle
        run: make web

      - name: Verify outputs
        run: |
          ls -la web/td-engine.js web/td-engine.wasm
          test -f web/td-engine.js
          test -f web/td-engine.wasm

      - name: Upload WASM bundle
        uses: actions/upload-artifact@v4
        with:
          name: td-engine-wasm
          path: |
            web/td-engine.js
            web/td-engine.wasm
            web/index.html
            web/style.css
            web/examples/
            wasm/js_bridge.js
          if-no-files-found: error

      - name: Deploy web player to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: web
          publish_branch: gh-pages
          force_orphan: true
