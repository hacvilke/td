name: CI — Build (Desktop + WebAssembly)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Required by actions/deploy-pages for the deploy job.
# contents: write is kept for any future release-asset uploads.
permissions:
  contents: write
  pages: write
  id-token: write

# Only one Pages deploy at a time — older runs get cancelled.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  web-tests:
    name: Web Module Tests (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run web module tests
        run: |
          echo "=== test_web_modules.js ==="
          node tests/test_web_modules.js
          echo "=== test_net_websocket.js ==="
          node tests/test_net_websocket.js
          echo "=== test_editor_modules.js ==="
          node tests/test_editor_modules.js
          echo "=== test_persistence.js ==="
          node tests/test_persistence.js
          echo "=== test_net_peer.js ==="
          node tests/test_net_peer.js
          echo "=== test_net_interpolation.js ==="
          node tests/test_net_interpolation.js
          echo "=== test_net_auth_server.js ==="
          npm install --no-save ws
          node tests/test_net_auth_server.js
          echo "=== bench_render.js ==="
          node tests/bench_render.js

  wasm:
    name: Build WebAssembly
    needs: web-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest
          actions-cache-folder: emsdk-cache

      - name: Verify emcc
        run: emcc --version

      - name: Build WASM bundle
        run: make web

      - name: Verify outputs
        run: |
          ls -la web/td-engine.js web/td-engine.wasm
          test -f web/td-engine.js
          test -f web/td-engine.wasm

      - name: Stage JS bridge into web/
        run: cp wasm/js_bridge.js web/js_bridge.js

      - name: Stage developer guide into web/ (if not already in web/)
        run: |
          # web/GETTING_STARTED.md is committed at this path; this step is a
          # safety net in case it ever moves back to wasm/ or docs/.
          test -f web/GETTING_STARTED.md || cp wasm/GETTING_STARTED.md web/GETTING_STARTED.md 2>/dev/null || true
          test -f web/GETTING_STARTED.md || cp docs/RHYTHM_MECHANICS.md web/RHYTHM_MECHANICS.md 2>/dev/null || true
          ls -la web/GETTING_STARTED.md 2>&1 || echo "GETTING_STARTED.md not found (non-fatal)"

      - name: List final web/ contents (sanity check before artifact upload)
        run: |
          echo "=== web/ contents ==="
          find web -maxdepth 2 -type f | sort
          echo "=== sizes ==="
          du -b web/index.html web/style.css web/js_bridge.js web/td-engine.js web/td-engine.wasm 2>/dev/null

      - name: Upload WASM bundle (build artifact)
        uses: actions/upload-artifact@v4
        with:
          name: td-engine-wasm
          path: |
            web/td-engine.js
            web/td-engine.wasm
            web/index.html
            web/style.css
            web/js_bridge.js
            web/docs.html
            web/GETTING_STARTED.md
            web/td_api.js
            web/net_websocket.js
            web/net_peer.js
            web/server_router.js
            web/inspector.js
            web/profiler.js
            web/persistence.js
            web/error_boundary.js
            web/deprecated_tracker.js
          if-no-files-found: error

      # Assemble the Pages deploy directory: web/* at the root, plus the
      # 3D showcase demo at examples/3d-showcase/ (the showcase loads
      # engine scripts via ../../web/ relative paths).
      - name: Assemble Pages deploy directory
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p _pages/examples
          cp -r web/* _pages/
          cp -r examples/3d-showcase _pages/examples/3d-showcase
          echo "=== _pages contents ==="
          find _pages -maxdepth 3 -type f | sort

      # Upload a SINGLE Pages artifact — this is what actions/deploy-pages
      # pushes to the GitHub Pages CDN. MUST be named 'github-pages'.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _pages

  # Separate deploy job — required by actions/deploy-pages.
  # It must run in the 'github-pages' environment so GitHub trusts it
  # to push to the Pages CDN.
  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: wasm
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
