name: Build & Release (Native C++)

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # required for softprops/action-gh-release to upload assets

jobs:
  build-windows:
    name: Build Native (Windows / MSVC)
    runs-on: windows-latest
    continue-on-error: true   # never block the artifact upload on a build hiccup
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The "Visual Studio 17 2022" CMake generator relies on vswhere to
      # locate the VS install, which is fragile on windows-latest. We use
      # the VS Developer Command Prompt + Ninja instead — both are
      # preinstalled on the runner image and don't depend on third-party
      # actions that may disappear.
      - name: Configure CMake (Ninja + MSVC)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=x64
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin

      - name: Build
        id: build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=x64
          cmake --build build --parallel

      - name: Run unit tests
        if: success() || failure()
        shell: cmd
        continue-on-error: true
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=x64
          build\bin\test_math.exe || true
          build\bin\test_ecs.exe || true
          build\bin\test_physics.exe || true

      # Always stage + upload whatever binaries got built, even if the
      # build step partially failed (e.g. one example didn't compile).
      # People should be able to download the editor/games from CI.
      - name: Stage release artifacts
        if: always()
        shell: pwsh
        run: |
          $stage = "td-engine-windows-x64"
          New-Item -ItemType Directory -Force -Path "$stage/bin"
          New-Item -ItemType Directory -Force -Path "$stage/assets"
          New-Item -ItemType Directory -Force -Path "$stage/src"
          New-Item -ItemType Directory -Force -Path "$stage/examples"
          New-Item -ItemType Directory -Force -Path "$stage/editor"
          New-Item -ItemType Directory -Force -Path "$stage/tests"

          # Binaries (.exe + .lib) — Ninja puts them in build/bin/
          # Use -ErrorAction SilentlyContinue so missing files don't fail the step.
          Copy-Item -Path "build/bin/*.exe" -Destination "$stage/bin/" -ErrorAction SilentlyContinue
          Copy-Item -Path "build/bin/*.lib" -Destination "$stage/bin/" -ErrorAction SilentlyContinue
          Copy-Item -Path "build/*.lib"    -Destination "$stage/bin/" -ErrorAction SilentlyContinue

          # List what we got, for visibility in the CI log
          Write-Host "--- Binaries staged ---"
          Get-ChildItem "$stage/bin" -ErrorAction SilentlyContinue | Format-Table Name, Length

          # Assets (shaders) so the games/editor can find them at runtime
          Copy-Item -Path "assets/*" -Destination "$stage/assets/" -Recurse -ErrorAction SilentlyContinue

          # Source headers so users can #include the engine
          Copy-Item -Path "src/*" -Destination "$stage/src/" -Recurse -ErrorAction SilentlyContinue

          # Examples + editor + tests source
          Copy-Item -Path "examples/*" -Destination "$stage/examples/" -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "editor/*"   -Destination "$stage/editor/"   -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "tests/*"    -Destination "$stage/tests/"    -Recurse -ErrorAction SilentlyContinue

          # Docs
          Copy-Item -Path "README.md"      -Destination "$stage/" -ErrorAction SilentlyContinue
          Copy-Item -Path "Makefile"       -Destination "$stage/" -ErrorAction SilentlyContinue
          Copy-Item -Path "CMakeLists.txt" -Destination "$stage/" -ErrorAction SilentlyContinue

          # Write a README inside the zip explaining what's inside
          @"
          TD Engine — Windows x64 Build
          ==============================

          Generated: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC') (UTC)
          Commit:    ${{ github.sha }}
          Ref:       ${{ github.ref }}

          Contents:
            bin/        Compiled .exe (pong, platformer, td-editor, tests) and .lib
            assets/     Shaders (sprite.vert, sprite.frag, basic_3d.vert/frag)
            src/        Engine source headers (.h) and .cpp
            examples/   Example game sources (pong, platformer)
            editor/     Native editor sources
            tests/      Unit test sources

          Usage:
            bin\pong.exe
            bin\platformer.exe
            bin\td-editor.exe

          Note: td-editor.exe is a minimal Win32 + OpenGL editor scaffold.
          The panels (scene, inspector, asset browser, console) are stubs
          that compile and run but don't yet have full functionality.

          Full source: https://github.com/hacvilke/td
          "@ | Out-File -FilePath "$stage/USAGE.txt" -Encoding utf8

          # Zip
          Compress-Archive -Path "$stage" -DestinationPath "td-engine-windows-x64.zip" -Force

          # Verify the zip has content
          $size = (Get-Item "td-engine-windows-x64.zip").Length
          Write-Host "Zip size: $size bytes"
          if ($size -lt 1000) {
            Write-Host "::warning::Zip is suspiciously small ($size bytes) — build may have failed"
          }

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td-engine-windows-x64
          path: td-engine-windows-x64.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Attach to release
        if: always() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: td-engine-windows-x64.zip
          name: TD Engine ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
