name: Build & Release (Native C++)

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Native (Windows / MSVC)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Configure (CMake / Ninja)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -property installationPath
          $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          cmd /c "call `"$vsDevCmd`" -arch=amd64 -host_arch=x64 && cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin 2>&1"

      - name: Build
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -property installationPath
          $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          cmd /c "call `"$vsDevCmd`" -arch=amd64 -host_arch=x64 && cmake --build build --parallel 2>&1"

      - name: Run unit tests
        if: success() || failure()
        shell: pwsh
        continue-on-error: true
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath  = & $vswhere -latest -property installationPath
          $vsDevCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          cmd /c "call `"$vsDevCmd`" -arch=amd64 -host_arch=x64 && (build\bin\test_math.exe || ver>nul) && (build\bin\test_ecs.exe || ver>nul) && (build\bin\test_physics.exe || ver>nul) 2>&1"

      - name: Stage release artifacts
        if: always()
        shell: pwsh
        run: |
          $stage = "td-engine-windows-x64"
          New-Item -ItemType Directory -Force -Path "$stage/bin"
          New-Item -ItemType Directory -Force -Path "$stage/assets"
          New-Item -ItemType Directory -Force -Path "$stage/src"
          New-Item -ItemType Directory -Force -Path "$stage/examples"
          New-Item -ItemType Directory -Force -Path "$stage/editor"
          New-Item -ItemType Directory -Force -Path "$stage/tests"

          Copy-Item -Path "build/bin/*.exe" -Destination "$stage/bin/" -ErrorAction SilentlyContinue
          Copy-Item -Path "build/bin/*.lib" -Destination "$stage/bin/" -ErrorAction SilentlyContinue
          Copy-Item -Path "build/*.lib"    -Destination "$stage/bin/" -ErrorAction SilentlyContinue

          Write-Host "--- Binaries staged ---"
          Get-ChildItem "$stage/bin" -ErrorAction SilentlyContinue | Format-Table Name, Length

          Copy-Item -Path "assets/*" -Destination "$stage/assets/" -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "src/*" -Destination "$stage/src/" -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "examples/*" -Destination "$stage/examples/" -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "editor/*"   -Destination "$stage/editor/"   -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "tests/*"    -Destination "$stage/tests/"    -Recurse -ErrorAction SilentlyContinue

          Copy-Item -Path "README.md"      -Destination "$stage/" -ErrorAction SilentlyContinue
          Copy-Item -Path "LICENSE"        -Destination "$stage/" -ErrorAction SilentlyContinue
          Copy-Item -Path "Makefile"       -Destination "$stage/" -ErrorAction SilentlyContinue
          Copy-Item -Path "CMakeLists.txt" -Destination "$stage/" -ErrorAction SilentlyContinue

          @"
          TD Engine -- Windows x64 Build
          ==============================

          Generated: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss UTC') (UTC)
          Commit:    ${{ github.sha }}
          Ref:       ${{ github.ref }}

          Contents:
            bin/        Compiled .exe (pong, platformer, td-editor, tests) and .lib
            assets/     Shaders (sprite.vert, sprite.frag, basic_3d.vert/frag)
            src/        Engine source headers (.h) and .cpp
            examples/   Example game sources (pong, platformer)
            editor/     Native editor sources
            tests/      Unit test sources

          Usage:
            bin\pong.exe
            bin\platformer.exe
            bin\td-editor.exe
          "@ | Out-File -FilePath "$stage/USAGE.txt" -Encoding utf8

          Compress-Archive -Path "$stage" -DestinationPath "td-engine-windows-x64.zip" -Force

          $size = (Get-Item "td-engine-windows-x64.zip").Length
          Write-Host "Zip size: $size bytes"
          if ($size -lt 1000) {
            Write-Host "::warning::Zip is suspiciously small ($size bytes) -- build may have failed"
          }

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: td-engine-windows-x64
          path: td-engine-windows-x64.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Attach to release
        if: always() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: td-engine-windows-x64.zip
          name: TD Engine ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
