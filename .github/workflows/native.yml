name: Build & Release (Native C++)

on:
  push:
    branches: [main, master]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write   # required for softprops/action-gh-release to upload assets

jobs:
  build-windows:
    name: Build Native (Windows / MSVC)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The "Visual Studio 17 2022" CMake generator relies on vswhere to
      # locate the VS install, which is fragile on windows-latest. We use
      # the VS Developer Command Prompt + Ninja instead — both are
      # preinstalled on the runner image and don't depend on third-party
      # actions that may disappear.
      - name: Configure CMake (Ninja + MSVC)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=x64
          cmake -B build -S . -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=x64
          cmake --build build --parallel

      - name: Run unit tests
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat" -arch=amd64 -host_arch=x64
          build\bin\test_math.exe || true
          build\bin\test_ecs.exe || true
          build\bin\test_physics.exe || true

      - name: Stage release artifacts
        shell: pwsh
        run: |
          $stage = "td-engine-windows-x64"
          New-Item -ItemType Directory -Force -Path "$stage/bin"
          New-Item -ItemType Directory -Force -Path "$stage/assets"
          New-Item -ItemType Directory -Force -Path "$stage/src"
          New-Item -ItemType Directory -Force -Path "$stage/examples"
          New-Item -ItemType Directory -Force -Path "$stage/editor"
          New-Item -ItemType Directory -Force -Path "$stage/tests"

          # Binaries (.exe + .lib) — Ninja puts them in build/bin/
          Copy-Item -Path "build/bin/*.exe" -Destination "$stage/bin/" -ErrorAction SilentlyContinue
          Copy-Item -Path "build/bin/*.lib" -Destination "$stage/bin/" -ErrorAction SilentlyContinue
          Copy-Item -Path "build/*.lib"    -Destination "$stage/bin/" -ErrorAction SilentlyContinue

          # Assets (shaders) so the games/editor can find them at runtime
          Copy-Item -Path "assets/*" -Destination "$stage/assets/" -Recurse -ErrorAction SilentlyContinue

          # Source headers so users can #include the engine
          Copy-Item -Path "src/*" -Destination "$stage/src/" -Recurse -ErrorAction SilentlyContinue

          # Examples + editor + tests
          Copy-Item -Path "examples/*" -Destination "$stage/examples/" -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "editor/*"   -Destination "$stage/editor/"   -Recurse -ErrorAction SilentlyContinue
          Copy-Item -Path "tests/*"    -Destination "$stage/tests/"    -Recurse -ErrorAction SilentlyContinue

          # Docs
          Copy-Item -Path "README.md"      -Destination "$stage/"
          Copy-Item -Path "Makefile"       -Destination "$stage/"
          Copy-Item -Path "CMakeLists.txt" -Destination "$stage/"

          # Zip
          Compress-Archive -Path "$stage" -DestinationPath "td-engine-windows-x64.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: td-engine-windows-x64
          path: td-engine-windows-x64.zip
          retention-days: 14

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: td-engine-windows-x64.zip
          name: TD Engine ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
