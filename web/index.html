<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!--
      The standalone web player used to live here with an inline
      `await import('./js_bridge.ts')` module script. That worked in
      `vite dev` (where Vite transforms .ts on the fly) but broke in
      production because Vite only builds the root index.html as an
      entry — web/index.html was never processed, so the browser
      tried to fetch `./js_bridge.ts` as a raw file and failed with
      "Failed to fetch dynamically imported module".

      The game now lives inside the React app at the repo root
      (src/GamePage.tsx -> web/game/pong.ts). Redirect there.
    -->
    <meta http-equiv="refresh" content="0; url=../">
    <title>TD Engine — Redirecting</title>
    <script>window.location.replace('../');</script>
</head>
<body>
    <p>Redirecting to <a href="../">TD Engine home</a>…</p>
</body>
</html>
